name: Custom Android release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: custom-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'siddeekazeez/APL-TV'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE: gradle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Merge latest upstream release locally
        if: github.event_name != 'push'
        run: bash tools/sync-upstream.sh
      - name: Decide whether a release is needed
        id: needed
        run: |
          current=$(git rev-parse HEAD)
          released=$(gh release view --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "$current" != "$released" ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checks and sports regression tests
        run: |
          python3 tools/check.py
          node tools/test-custom-sports.cjs
      - name: Android SDK and image library
        if: steps.needed.outputs.build == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null || test -d "$ANDROID_HOME/platforms/android-35"
          python3 -m pip install --quiet pillow
      - name: Restore private signing key
        if: steps.needed.outputs.build == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEY_B64" || { echo '::error::Missing private signing key'; exit 1; }
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "APL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed custom APK
        if: steps.needed.outputs.build == 'true'
        env:
          APL_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          CUSTOM_VERSION_CODE: ${{ github.run_number }}
        run: |
          export CUSTOM_VERSION_CODE=$((1000000 + CUSTOM_VERSION_CODE))
          python3 tools/make-android.py --release
          cp dist/apl-tv-v*-android.apk dist/apl-tv-sports-android.apk
          (cd dist && sha256sum apl-tv-sports-android.apk > SHA256SUMS-custom.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/apl-tv-sports-android.apk
      - name: Publish tested source and release
        if: steps.needed.outputs.build == 'true'
        run: |
          git push origin HEAD:main
          tag="custom-${{ github.run_number }}"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Custom Android build of [APL TV by Knikt (Gero Corp.)](https://github.com/Knikt/APL-TV), distributed under its original MIT license.

          Changes: MMA promotions, event pages and complete fight cards; individual/event artwork fallback; cricket national teams and seven franchise leagues; live-first chronological ordering; existing favorites migrated; separate Android app named APL TV Sports. See CUSTOMIZATIONS.md for data coverage and limitations.

          Install apl-tv-sports-android.apk. Later builds use the same signing key and preserve this custom app's settings. The official app remains separate. No channels, providers or playlists are included.
          NOTES
          gh release create "$tag" dist/apl-tv-sports-android.apk dist/SHA256SUMS-custom.txt --target "$(git rev-parse HEAD)" --title "APL TV Sports · build ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - uses: actions/upload-artifact@v4
        if: steps.needed.outputs.build == 'true'
        with:
          name: APL-TV-Sports-Android
          path: |
            dist/apl-tv-sports-android.apk
            dist/SHA256SUMS-custom.txt
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
